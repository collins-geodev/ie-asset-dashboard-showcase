<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b1015;--bg2:#101820;--card:#0f171f;--border:#1a2535;--accent:#00d4ff;--accent2:#0099cc;--text:#e2e8f0;--text2:#7a8a9e}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100%}
body{display:flex;flex-direction:column;align-items:center;padding:40px 20px 48px}
main{width:100%;max-width:1080px}
h1{font-size:clamp(22px,3.2vw,32px);font-weight:700;color:var(--accent);letter-spacing:.2px;margin-bottom:10px}
p.lead{color:var(--text2);font-size:15px;line-height:1.6;margin-bottom:22px}
.player{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:0 8px 32px rgba(0,0,0,.55)}
video{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:8px;background:#000}
.actions{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px}
a.btn{display:inline-block;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;transition:background .15s,color .15s}
a.btn.primary{background:var(--accent);color:#06121a}
a.btn.primary:hover{background:var(--accent2);color:#fff}
a.btn.ghost{border:1px solid var(--border);color:var(--text)}
a.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
footer{margin-top:32px;color:var(--text2);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>Enterprise GIS Asset Dashboard: Demo Walkthrough</h1>
  <p class="lead">62-second walkthrough of an enterprise GIS asset dashboard for a power distribution network. Demo built on synthetic data.</p>
  <div class="player">
    <video controls playsinline preload="metadata" poster="cover.png" width="1920" height="1080">
      <source src="ie_showcase_demo.mp4" type="video/mp4">
      Your browser does not support HTML5 video. <a href="ie_showcase_demo.mp4">Download the MP4</a>.
    </video>
  </div>
  <div class="actions">
    <a class="btn primary" href="../">Open the live demo</a>
    <a class="btn ghost" href="ie_showcase_demo.mp4" download>Download MP4</a>
  </div>
  <footer>All data shown is synthetic and for portfolio purposes only.</footer>
</main>
</body>
